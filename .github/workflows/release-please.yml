name: Release

# Runs on every push to testing (and by hand: Actions › Release › Run workflow). release-please
# keeps a pull request titled "chore: release X.Y.Z" open and up to date: it bumps the version
# everywhere it appears (release-please-config.json) and lists the commits since the last
# release in CHANGELOG.md. Merging that pull request into testing makes the release: it tags it,
# creates a GitHub Release, and the next deploy shows the new version. The version comes from
# the commit messages:
#   fix: …  → patch    feat: …  → minor    feat!: … / BREAKING CHANGE → major
# (Before 1.0.0, breaking changes bump the minor version instead.)

# Needs Settings › Actions › General › "Allow GitHub Actions to create and
# approve pull requests".
on:
  push:
    branches: [testing]
  workflow_dispatch:

# One run at a time; a newer push supersedes a waiting one.
concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          target-branch: testing
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The lockfiles and the API schema record the version too, and release-please doesn't
      # update them: without this, the release's uv sync --locked (the API's image, CI) refuses
      # to build, and CI finds the schema out of date. Runs whenever release-please (re)writes
      # its pull request's branch.
      - if: steps.release.outputs.prs_created == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
      - if: steps.release.outputs.prs_created == 'true'
        uses: astral-sh/setup-uv@v6
      - if: steps.release.outputs.prs_created == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Update the lockfiles and the API schema to the new version
        if: steps.release.outputs.prs_created == 'true'
        run: |
          (cd backend && uv lock)
          npm install --package-lock-only --ignore-scripts
          version=$(jq -r '."."' .release-please-manifest.json)
          # The schema's first "version:" is its info.version, the API's (manage.py spectacular).
          sed -i "0,/^  version: .*/s//  version: $version/" backend/openapi.yaml
          if git diff --quiet; then
            echo "The lockfiles and the API schema already match."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --all --message "chore: lockfiles and API schema at the release's version"
          git push
